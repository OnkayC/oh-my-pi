name: Warm darwin Bazel cache

# Darwin release builds compile their own native addon and are the longest
# release leg. Keep that hosted-runner cache near main so a tag build processes
# only the source/version delta instead of rebuilding the full toolchain graph.

on:
   push:
      branches: [main]
      paths:
         - "crates/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - ".github/**"
   workflow_dispatch:

permissions:
   contents: read

# A cancelled warm run saves nothing, so let an in-flight refresh finish.
concurrency:
   group: bazel-cache-warm
   cancel-in-progress: false

jobs:
   warm_darwin:
      name: "Seed darwin release bazel cache: ${{ matrix.target }}"
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: macos-14, target: darwin-arm64, scope: release-darwin-arm64 }
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         # scripts/bazel-natives.ts is dependency-free (node builtins only), so
         # no `bun install` is needed; the bazel-natives action restores,
         # builds, and saves the scope's disk cache.
         - uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.target }}
              cache-scope: ${{ matrix.scope }}
