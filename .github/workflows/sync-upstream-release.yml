name: Sync upstream release

# GitHub only emits release events in the repository that publishes them.
# Poll upstream so this fork can react without upstream-side configuration.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: can1357/oh-my-pi
  TARGET_BRANCH: main

jobs:
  sync:
    name: Sync unpublished upstream releases
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3"

      - name: Merge releases or open a stacked conflict pull request
        env:
          GH_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
        run: bun scripts/sync-upstream-release.ts
