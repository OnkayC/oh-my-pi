name: "bun install (GitHub cache)"
description: >
   Install the pinned Bun release, restore its package store, and run a frozen
   workspace install. Pull requests restore the default-branch cache but only
   trusted non-PR runs save new entries, avoiding one copy per PR ref.

runs:
   using: composite
   steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
           bun-version: "1.3.14"

      - name: Restore bun store
        id: bun-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           path: ~/.bun/install/cache
           key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
           restore-keys: |
              bun-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
           if bun install --frozen-lockfile; then
             exit 0
           fi
           echo "::warning title=bun install retry::cached install failed; retrying with a clean job-local cache"
           retry_cache="$(mktemp -d "${RUNNER_TEMP:-/tmp}/bun-cache-retry.XXXXXX")"
           bun install --frozen-lockfile --cache-dir="$retry_cache"

      - name: Save bun store
        if: github.event_name != 'pull_request' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           path: ~/.bun/install/cache
           key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
